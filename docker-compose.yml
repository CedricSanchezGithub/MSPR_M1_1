# docker-compose.yml — Metabase + SQLite + serveur d'images
# Lancement : docker compose up -d
# Metabase  : http://localhost:3000
# Images    : http://localhost:8080/phase4/04_carte_predictions_2026.png

services:
  metabase:
    image: metabase/metabase:latest
    container_name: electio_metabase
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
      - ./data/output:/sqlite-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SITE_LOCALE: fr
      JAVA_TIMEZONE: Europe/Paris
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  images:
    image: nginx:alpine
    container_name: electio_images
    ports:
      - "8080:80"
    volumes:
      - ./graphiques:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  metabase_data:
    driver: local

# -------------------------------------------------------------------
